name: Check Hostinger domain

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domain to look up on Hostinger
        required: true
        default: ikasipolban.com

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query Hostinger hosting API for domain
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          if [ -z "$HOSTINGER_API_TOKEN" ]; then
            echo "HOSTINGER_API_TOKEN secret is not set."
            exit 1
          fi

          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            "https://developers.hostinger.com/api/hosting/v1/websites?domain=$DOMAIN")

          echo "HTTP status: $http_code"
          echo "Response body:"
          cat response.json
