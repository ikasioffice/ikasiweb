name: Check konten Google Apps Script (beasiswa)

# Diagnostik sementara untuk migrasi modul Beasiswa Alumni: membaca konten yang
# tersimpan di backend lama (Google Apps Script + Sheets) agar bisa dibandingkan
# dengan teks bawaan di app/(public)/beasiswa/_content.ts.
#
# Action getContent bersifat publik — dipanggil juga oleh halaman depan
# microsite lama — jadi TIDAK butuh password admin. Jangan pernah menaruh
# password di input workflow: input tersimpan di riwayat run repositori.
#
# Hapus workflow ini setelah Apps Script dipensiunkan.

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: URL Web App Apps Script
        required: true
        default: https://script.google.com/macros/s/AKfycbz-i6yZJHrgCTceXSg4y0NIz0Mj6qAsXtiJ3JmzGTI2f9nlJIapQ4DHbPs09Ni2UW6U/exec
      action:
        description: Action yang dipanggil (getContent / getSiteData)
        required: true
        default: getContent

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil endpoint
        env:
          ENDPOINT: ${{ inputs.endpoint }}
          ACTION: ${{ inputs.action }}
        run: |
          # -L wajib: Apps Script mengalihkan ke script.googleusercontent.com.
          curl -sSL --max-time 60 -X POST "$ENDPOINT" \
            -H 'Content-Type: text/plain;charset=utf-8' \
            -d "{\"action\":\"$ACTION\"}" \
            -o hasil.json -w 'HTTP %{http_code}, %{size_download} byte\n'

      - name: Tampilkan hasil
        run: |
          echo "== Ringkasan =="
          python3 - <<'PY'
          import json
          try:
              d = json.load(open("hasil.json"))
          except Exception as e:
              print("Bukan JSON:", e)
              print(open("hasil.json", encoding="utf-8", errors="replace").read()[:2000])
              raise SystemExit(0)

          data = d.get("data") or {}
          print("ok:", d.get("ok"), "| jumlah key:", len(data))
          print()
          for k in sorted(data):
              v = "" if data[k] is None else str(data[k])
              print(f"--- {k} ({len(v)} char) ---")
              print(v if v else "(kosong)")
              print()
          PY
