name: Build check

# Build + artifact saja. Deploy ke produksi TIDAK lewat workflow ini.
#
# Riwayat: auto-deploy FTP dimatikan (sertifikat FTPS CN mismatch, FTP timeout),
# lalu diganti Hostinger API (hosting_deployStaticWebsite) — tapi endpoint
# trigger deploy-nya konsisten gagal `[Hosting:9999] Request failed` dari sisi
# Hostinger (bukan token: step 1-3 sukses dengan token yang sama).
#
# Keputusan (Agt 2026): step deploy API DIMATIKAN. Build check harus selalu
# hijau; artifact `out` di-download lalu di-deploy via SFTP langsung ke
# Hostinger dari laptop (port 65002, SSH key) — lihat AGENTS.md profile IKASI.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm build

      - name: Upload static output
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 7
