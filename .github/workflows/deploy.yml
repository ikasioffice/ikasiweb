name: Build check

# Auto-deploy lewat FTP dimatikan: server FTP Hostinger memakai sertifikat
# shared yang CN-nya tidak cocok dengan hostname, sehingga FTPS dengan
# verifikasi selalu gagal, dan plain FTP sering "Timeout (control socket)".
#
# Deploy ke produksi dilakukan via Hostinger API (hosting_deployStaticWebsite)
# yang lebih andal & aman. Workflow ini hanya memverifikasi bahwa build sukses
# pada tiap push, agar tidak ada kode rusak yang masuk ke main.
#
# Untuk mengaktifkan kembali auto-deploy yang aman: tambahkan secret
# HOSTINGER_API_TOKEN lalu panggil endpoint deploy API di step terpisah.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm build

      - name: Upload static output
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 7
