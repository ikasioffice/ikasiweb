name: Build check

# Auto-deploy lewat FTP dimatikan: server FTP Hostinger memakai sertifikat
# shared yang CN-nya tidak cocok dengan hostname, sehingga FTPS dengan
# verifikasi selalu gagal, dan plain FTP sering "Timeout (control socket)".
#
# Deploy ke produksi dilakukan via Hostinger API (hosting_deployStaticWebsite),
# lihat .github/hostinger-deploy/. Deploy hanya jalan untuk push ke main;
# workflow_dispatch dan push ke branch lain cuma menjalankan build check.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm build

      - name: Upload static output
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 7

      - name: Archive static output
        if: github.ref == 'refs/heads/main'
        run: cd out && zip -r ../site.zip . && cd ..

      - name: Install Hostinger deploy script dependencies
        if: github.ref == 'refs/heads/main'
        run: npm install --prefix .github/hostinger-deploy

      - name: Deploy to Hostinger
        if: github.ref == 'refs/heads/main'
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          DOMAIN: ikasipolban.com
          ARCHIVE_PATH: site.zip
        run: node .github/hostinger-deploy/deploy.mjs
